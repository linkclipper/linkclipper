<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkClipper</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app">
    <!-- ============================================================ sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">W</span>
        <span class="brand-name">LinkClipper</span>
      </div>

      <nav id="boardNav" class="board-nav">
        <!-- rendered by JS -->
      </nav>

      <button id="newBoardBtn" class="ghost-btn">ï¼‹ New board</button>

      <div class="sidebar-foot">
        <button id="syncOpenBtn" class="foot-btn">â˜ Sync</button>
        <button id="exportBtn" class="foot-btn">â†“ Export</button>
        <button id="importBtn" class="foot-btn">â†‘ Import</button>
        <input type="file" id="importFile" accept="application/json" class="hidden" />
      </div>
      <div id="syncStatusShort" class="sync-status"></div>
    </aside>

    <!-- ============================================================ main -->
    <div class="main">
      <header class="topbar">
        <input id="search" class="search" type="search"
               placeholder="Search titles, notes, tags, URLsâ€¦ ( / to focus )" />
        <div class="filters">
          <select id="typeFilter" class="filter-select">
            <option value="">All types</option>
          </select>
          <select id="tagFilter" class="filter-select">
            <option value="">All tags</option>
          </select>
          <select id="sortSelect" class="filter-select">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="title">Title Aâ†’Z</option>
          </select>
        </div>
        <div id="countLine" class="count-line"></div>
      </header>

      <main id="content" class="content">
        <!-- rendered by JS: active-filter chip row + masonry grid -->
      </main>
    </div>
  </div>

  <!-- ============================================================ modal -->
  <div id="modalBack" class="modal-back hidden">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="../lib/shared.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/supabase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
