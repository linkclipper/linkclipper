<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkClipper</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app">
    <!-- ============================================================ sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="../icons/mark.svg" alt="" />
        <span class="brand-name">LinkClipper</span>
      </div>

      <div class="sidebar-label">YOUR LIBRARY <span>✦</span></div>

      <nav id="boardNav" class="board-nav">
        <!-- rendered by JS -->
      </nav>

      <button id="newBoardBtn" class="ghost-btn">＋ New board</button>

      <button id="profileBtn" class="profile-card" type="button" aria-label="Open local profile">
        <span id="profileAvatar" class="profile-avatar">✦</span>
        <span class="profile-copy"><strong id="profileName">Your space</strong><small>Local profile · Edit</small></span>
        <span class="profile-chevron" aria-hidden="true">›</span>
      </button>

      <div class="sidebar-foot">
        <button id="syncOpenBtn" class="foot-btn">☁ Sync</button>
        <button id="aiOpenBtn" class="foot-btn" title="Local AI access">✦ AI</button>
        <button id="exportBtn" class="foot-btn">↓ Export</button>
        <button id="importBtn" class="foot-btn">↑ Import</button>
        <input type="file" id="importFile" accept="application/json" class="hidden" />
        <input type="file" id="aiChangesFile" accept="application/json" class="hidden" />
      </div>
      <div id="syncStatusShort" class="sync-status"></div>
    </aside>

    <!-- ============================================================ main -->
    <div class="main">
      <header class="topbar">
        <input id="search" class="search" type="search"
               placeholder="Search titles, notes, tags, URLs… ( / to focus )" />
        <button id="commandsBtn" class="commands-trigger" type="button" title="Open command palette">Commands <kbd>Ctrl+Shift+P</kbd></button>
        <div class="filters">
          <select id="typeFilter" class="filter-select">
            <option value="">All types</option>
          </select>
          <select id="tagFilter" class="filter-select">
            <option value="">All tags</option>
          </select>
          <select id="sortSelect" class="filter-select">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="title">Title A→Z</option>
          </select>
        </div>
        <div id="countLine" class="count-line"></div>
      </header>

      <main id="content" class="content">
        <!-- rendered by JS: active-filter chip row + masonry grid -->
      </main>
    </div>
  </div>

  <!-- ============================================================ modal -->
  <div id="modalBack" class="modal-back hidden">
    <div id="modal" class="modal"></div>
  </div>

  <div id="paletteBack" class="palette-back hidden">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="paletteQuery" class="palette-query" type="search" autocomplete="off"
             placeholder="Search commands or boards…" aria-label="Search commands" />
      <div id="paletteList" class="palette-list" role="listbox" aria-label="Commands"></div>
      <div class="palette-foot">↑ ↓ Navigate <span>Enter Run</span> <span>Esc Close</span></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="../lib/shared.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/profile.js"></script>
  <script src="../lib/shares.js"></script>
  <script src="../lib/shortcuts.js"></script>
  <script src="../lib/supabase.js"></script>
  <script src="../lib/ai-export.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
