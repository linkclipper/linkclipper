name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build store zip
        shell: pwsh
        run: ./tools/pack.ps1

      - name: Create GitHub release with the store zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem LinkClipper-*.zip | Select-Object -First 1).FullName
          gh release create $tag "$zip" --title "LinkClipper $tag" --generate-notes
