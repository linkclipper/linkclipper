name: Bug report
description: Something broke or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include steps to reproduce. If it's visual, attach a screenshot.
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where did it happen (site and dashboard vs in-page)?
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: ["Chrome", "Brave", "Edge", "Other Chromium"]
  - type: input
    id: version
    attributes:
      label: LinkClipper version
      placeholder: "0.3.0"
